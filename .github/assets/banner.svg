<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" font-family="Segoe Print, Bradley Hand, Comic Sans MS, cursive" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#f2926e" stroke-width="1.4"/>
    </pattern>
    <clipPath id="round">
      <rect x="0" y="0" width="1200" height="300" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect x="0" y="0" width="1200" height="300" fill="#ffffff"/>

    <!-- soft background blobs, like the original -->
    <ellipse cx="120" cy="40" rx="260" ry="180" fill="#8b7ff0" opacity="0.16"/>
    <ellipse cx="1080" cy="260" rx="260" ry="190" fill="#7bd9a5" opacity="0.16"/>

    <!-- ── left: a little "network" of keyframes instead of avatars ── -->
    <g stroke="#a7a2f0" stroke-width="1.5" stroke-dasharray="4 4" fill="none">
      <path d="M75,145 L165,205"/>
      <path d="M165,205 L100,245"/>
      <path d="M165,205 L235,255"/>
    </g>

    <!-- keyframe 1 -->
    <g transform="translate(75,145)">
      <rect x="-22" y="-22" width="44" height="44" rx="10" fill="#ffffff" stroke="#6965db" stroke-width="3" transform="rotate(45)"/>
      <text x="0" y="6" text-anchor="middle" font-size="16" fill="#6965db" font-weight="bold">1</text>
    </g>
    <!-- keyframe 2 -->
    <g transform="translate(165,205)">
      <rect x="-24" y="-24" width="48" height="48" rx="10" fill="#ffffff" stroke="#6965db" stroke-width="3" transform="rotate(45)"/>
      <text x="0" y="6" text-anchor="middle" font-size="17" fill="#6965db" font-weight="bold">2</text>
    </g>
    <!-- keyframe 3 -->
    <g transform="translate(100,245)">
      <rect x="-18" y="-18" width="36" height="36" rx="8" fill="#ffffff" stroke="#847dfb" stroke-width="3" transform="rotate(45)"/>
      <text x="0" y="5" text-anchor="middle" font-size="13" fill="#847dfb" font-weight="bold">3</text>
    </g>
    <!-- keyframe 4 -->
    <g transform="translate(235,255)">
      <rect x="-18" y="-18" width="36" height="36" rx="8" fill="#ffffff" stroke="#847dfb" stroke-width="3" transform="rotate(45)"/>
      <text x="0" y="5" text-anchor="middle" font-size="13" fill="#847dfb" font-weight="bold">4</text>
    </g>

    <!-- ── center: wordmark ── -->
    <g transform="translate(430,150)">
      <!-- icon: pencil + play triangle -->
      <g transform="translate(-40,-28)">
        <path d="M0,50 L34,16 L48,30 L14,64 Z" fill="#6965db"/>
        <path d="M34,16 L44,6 A8,8 0 0 1 48,16 L48,30 Z" fill="#847dfb"/>
        <path d="M6,58 L14,50 L22,58 L10,68 Z" fill="#1e1b4b"/>
      </g>
      <text x="20" y="14" font-size="54" font-weight="bold" fill="#1e1b4b" letter-spacing="1">
        EXCALIDRAW <tspan fill="#6965db">ANIMATE</tspan>
      </text>
      <text x="20" y="46" font-size="18" fill="#6a6a8a" font-family="Verdana, sans-serif">
        Draw a scene. Change it. Watch it come alive.
      </text>
    </g>

    <!-- ── right: morphing-arrow motif + crosshatch diamonds ── -->
    <g transform="translate(1010,150)" fill="none" stroke-linecap="round">
      <path d="M-60,40 L40,-40" stroke="#6965db" stroke-width="2" opacity="0.25"/>
      <path d="M-50,30 L45,-25" stroke="#6965db" stroke-width="3" opacity="0.55"/>
      <path d="M-40,20 L50,-10" stroke="#6965db" stroke-width="4" opacity="1"/>
      <path d="M50,-10 L38,-16 M50,-10 L44,2" stroke="#6965db" stroke-width="4"/>
    </g>

    <g fill="url(#hatch)" stroke="#f2926e" stroke-width="1.5">
      <rect x="1105" y="55" width="26" height="26" transform="rotate(20 1118 68)"/>
      <rect x="1145" y="95" width="20" height="20" transform="rotate(15 1155 105)"/>
      <rect x="1075" y="105" width="18" height="18" transform="rotate(30 1084 114)"/>
    </g>
    <circle cx="1155" cy="55" r="6" fill="none" stroke="#f2926e" stroke-width="2"/>
    <rect x="1085" y="215" width="18" height="18" fill="#7bd9a5" transform="rotate(45 1094 224)"/>

    <g transform="translate(1150,230)">
      <circle r="26" fill="#7bd9a5" opacity="0.35"/>
      <path d="M-6,-9 L11,0 L-6,9 Z" fill="#1e1b4b"/>
    </g>
  </g>
</svg>
