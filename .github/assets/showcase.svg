<svg viewBox="0 0 1200 820" xmlns="http://www.w3.org/2000/svg" font-family="Segoe Print, Bradley Hand, Comic Sans MS, cursive" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="win"><rect x="0" y="0" width="1200" height="820" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#win)">
    <rect width="1200" height="820" fill="#f4f3ff"/>

    <!-- browser chrome -->
    <rect x="0" y="0" width="1200" height="56" fill="#2b2b3a"/>
    <circle cx="30" cy="28" r="7" fill="#ff5f57"/>
    <circle cx="54" cy="28" r="7" fill="#febc2e"/>
    <circle cx="78" cy="28" r="7" fill="#28c840"/>
    <rect x="380" y="14" width="440" height="28" rx="14" fill="#3d3d50"/>
    <text x="600" y="33" text-anchor="middle" font-size="15" fill="#c8c8e0" font-family="Verdana, sans-serif">🔒 excalidraw-animate.app</text>

    <!-- app toolbar -->
    <rect x="0" y="56" width="1200" height="60" fill="#ffffff"/>
    <rect x="0" y="115" width="1200" height="1" fill="#e5e5f0"/>
    <rect x="24" y="74" width="40" height="28" rx="8" fill="#f1f0fe" stroke="#d8d6fb"/>
    <text x="44" y="93" text-anchor="middle" font-size="16" fill="#6965db">☰</text>

    <g transform="translate(480,72)">
      <rect x="0" y="0" width="240" height="32" rx="10" fill="#f1f0fe"/>
      <text x="16" y="21" font-size="15" fill="#555">↖ ✋ ▭ ◇ ○ ➔ ✎ 🔤</text>
    </g>

    <rect x="1080" y="72" width="96" height="32" rx="10" fill="#ffffff" stroke="#d8d6fb"/>
    <text x="1128" y="93" text-anchor="middle" font-size="13" fill="#6965db" font-family="Verdana, sans-serif">Library</text>

    <!-- canvas area -->
    <rect x="0" y="116" width="1200" height="560" fill="#fbfbff"/>

    <!-- animation frame label -->
    <rect x="120" y="150" width="960" height="380" fill="none" stroke="#c7c4f5" stroke-width="2" stroke-dasharray="6 5"/>
    <rect x="120" y="122" width="150" height="26" rx="6" fill="#6965db"/>
    <text x="195" y="140" text-anchor="middle" font-size="13" fill="#ffffff" font-family="Verdana, sans-serif">Frame: Intro</text>

    <!-- keyframe A shape (ghost, earlier position) -->
    <rect x="200" y="230" width="120" height="80" rx="8" fill="none" stroke="#c7c4f5" stroke-width="2" stroke-dasharray="5 5"/>
    <text x="260" y="330" text-anchor="middle" font-size="13" fill="#9a96d9" font-family="Verdana, sans-serif">keyframe 1</text>

    <!-- keyframe B shape (solid, later position, bigger + rotated) -->
    <g transform="translate(560,300) rotate(8)">
      <rect x="-90" y="-60" width="180" height="120" rx="10" fill="#ece9ff" stroke="#6965db" stroke-width="3"/>
    </g>
    <text x="560" y="405" text-anchor="middle" font-size="13" fill="#6965db" font-weight="bold" font-family="Verdana, sans-serif">keyframe 2</text>

    <!-- morphing arrow between two shapes -->
    <path d="M330,270 Q 445,180 468,255" fill="none" stroke="#c7c4f5" stroke-width="2.5" stroke-dasharray="6 4"/>
    <path d="M330,275 Q 445,300 468,262" fill="none" stroke="#1e1b4b" stroke-width="3"/>
    <path d="M468,262 L456,256 M468,262 L460,272" stroke="#1e1b4b" stroke-width="3" fill="none"/>
    <text x="400" y="230" text-anchor="middle" font-size="12" fill="#847dfb" font-family="Verdana, sans-serif" font-style="italic">arrow re-bends, not just slides</text>

    <!-- annotation bubble -->
    <g transform="translate(790,220)">
      <rect x="0" y="0" width="230" height="86" rx="10" fill="#fff7ea" stroke="#e8b95b" stroke-width="2"/>
      <text x="14" y="26" font-size="14" fill="#7a5b12" font-family="Verdana, sans-serif">Shapes, color, opacity</text>
      <text x="14" y="46" font-size="14" fill="#7a5b12" font-family="Verdana, sans-serif">and arrows all tween</text>
      <text x="14" y="66" font-size="14" fill="#7a5b12" font-family="Verdana, sans-serif">smoothly — powered by GSAP</text>
    </g>

    <!-- ── timeline panel ── -->
    <rect x="0" y="676" width="1200" height="144" fill="#ffffff"/>
    <rect x="0" y="676" width="1200" height="1" fill="#e5e5f0"/>

    <!-- transport controls -->
    <g transform="translate(40,700)" fill="#6965db">
      <path d="M0,0 L0,26 L-16,13 Z" transform="translate(20,0)"/>
      <circle cx="70" cy="13" r="20" fill="#6965db"/>
      <path d="M63,3 L83,13 L63,23 Z" fill="#ffffff"/>
      <path d="M120,0 L120,26 L136,13 Z" transform="translate(0,0)"/>
    </g>
    <text x="200" y="718" font-size="14" fill="#555" font-family="Verdana, sans-serif">0:02.4 / 0:08.0</text>

    <rect x="340" y="702" width="112" height="26" rx="8" fill="#6965db"/>
    <text x="396" y="720" text-anchor="middle" font-size="13" fill="#ffffff" font-family="Verdana, sans-serif">+ Keyframe</text>

    <rect x="470" y="702" width="90" height="26" rx="8" fill="#ffffff" stroke="#c7c4f5"/>
    <text x="515" y="720" text-anchor="middle" font-size="13" fill="#6965db" font-family="Verdana, sans-serif">🔊 Audio</text>

    <!-- audio clip -->
    <rect x="80" y="748" width="220" height="18" rx="6" fill="#bfe9d3" stroke="#4fae7e"/>
    <text x="90" y="761" font-size="11" fill="#245c3f" font-family="Verdana, sans-serif">narration.mp3</text>

    <!-- track line + keyframe diamonds -->
    <line x1="40" y1="792" x2="1160" y2="792" stroke="#e3e2f7" stroke-width="4"/>
    <line x1="120" y1="792" x2="620" y2="792" stroke="#c7c4f5" stroke-width="4"/>

    <g transform="translate(120,792)">
      <rect x="-10" y="-10" width="20" height="20" fill="#6965db" transform="rotate(45)"/>
    </g>
    <g transform="translate(620,792)">
      <rect x="-10" y="-10" width="20" height="20" fill="#6965db" transform="rotate(45)"/>
    </g>
    <g transform="translate(900,792)">
      <rect x="-10" y="-10" width="20" height="20" fill="#c7c4f5" stroke="#6965db" stroke-width="2" transform="rotate(45)"/>
    </g>

    <!-- playhead -->
    <line x1="360" y1="778" x2="360" y2="806" stroke="#1e1b4b" stroke-width="2"/>
    <circle cx="360" cy="778" r="5" fill="#1e1b4b"/>
  </g>

  <rect x="1" y="1" width="1198" height="818" rx="18" fill="none" stroke="#e0e0f0" stroke-width="2"/>
</svg>
